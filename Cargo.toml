[package]
name = "plugget"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "The package manager for Minecraft server plugins."
homepage = "https://plugget.dev"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
directories = "6"
fs2 = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
time = { version = "0.3", features = ["parsing", "formatting", "serde"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
toml = "0.8"
trash = "5"
zip = { version = "4", default-features = false, features = ["deflate"] }

[dev-dependencies]
wiremock = "0.6"

[profile.release]
lto = "thin"
strip = true
